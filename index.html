<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy First Mother's Day, Neha!</title>
<!-- Google Fonts for "Fancy" typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --primary-pink: #FFC0CB; /* Pink */
        --dark-pink: #D87093;   /* PaleVioletRed */
        --bg-lavender: #FFF0F5;  /* LavenderBlush */
        --text-color: #5A3D5C;
        --glass: rgba(255, 255, 255, 0.7);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: var(--bg-lavender);
        /* Subtle pattern background for "cute" */
        background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48ZyBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiNmZmU0ZTEiIGZpbGwtb3BhY2l0eT0iMC42Ij48cGF0aCBkPSJNMCAwaDR2NEgwVjB6bTQgNGg0djRIMFY0em00IDRoNHY0SDhWOHptNCA0aDR2NEgxMlYxMnptNCA0aDR2NEgxNlYxNnpNMjAgMDBoNHY0aC00VjB6bTQgNGg0djRIMjRWNHptNCA0aDR2NEgyOFY4em00IDRoNHY0SDMyVjEyek0wIDIwaDR2NEgwdi00em00IDRoNHY0SDR2LTR6bTQgNGg0djRIdHYtNHptNCA0aDR2NEgxMnYtNHptMTIgMDBoNHY0aC00di00em00IDRoNHY0SDI0di00em00IDRoNHY0SDI4di00em00IDRoNHY0SDMydi00eiIvPjwvZz48L2c+PC9zdmc+');
        font-family: 'Poppins', sans-serif;
        color: var(--text-color);
        overflow: hidden; /* For confetti */
    }

    /* Confetti container */
    #confetti-container {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        pointer-events: none;
    }

    .container {
        position: relative;
        width: 90%;
        max-width: 600px;
        background: var(--glass);
        backdrop-filter: blur(10px); /* Modern Glassmorphism */
        -webkit-backdrop-filter: blur(10px);
        padding: 50px 40px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(216, 112, 147, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.4);
        text-align: center;
        z-index: 10;
        animation: cardAppear 1s ease-out;
    }

    @keyframes cardAppear {
        0% { opacity: 0; transform: translateY(30px) scale(0.9); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
        font-family: 'Dancing Script', cursive; /* Fancy font */
        color: var(--dark-pink);
        font-size: 3.5rem;
        margin: 0;
        line-height: 1;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
    }

    .first-mothers-day {
        font-size: 1.2rem;
        font-weight: 700;
        color: #888;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: -5px;
        margin-bottom: 20px;
    }

    .subtitle {
        font-size: 1.1rem;
        color: #777;
        margin-bottom: 40px;
        font-weight: 300;
    }

    .affirmation-display {
        background-color: white;
        padding: 40px;
        border-radius: 20px;
        border: 2px solid #FFE4E1;
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.03);
        transition: transform 0.3s ease;
    }

    .affirmation-display:hover {
        transform: scale(1.02);
    }

    .affirmation-text {
        font-size: 1.4rem;
        font-weight: 500;
        line-height: 1.6;
        color: var(--text-color);
    }

    button {
        background: linear-gradient(135deg, var(--primary-pink) 0%, #FFA07A 100%);
        color: white;
        border: none;
        padding: 18px 35px;
        font-size: 1.3rem;
        font-weight: 700;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(255, 160, 122, 0.3);
        transition: all 0.3s ease;
        outline: none;
    }

    button:hover {
        box-shadow: 0 15px 25px rgba(255, 160, 122, 0.4);
        transform: translateY(-3px);
    }

    button:active {
        transform: translateY(1px) scale(0.98);
        box-shadow: 0 5px 10px rgba(255, 160, 122, 0.4);
    }

    .bottom-decor {
        font-size: 2.2rem;
        margin-top: 40px;
        opacity: 0.8;
    }
    
    .sparkle {
        display: inline-block;
        animation: sparkleAnimation 1.5s infinite;
    }
    
    @keyframes sparkleAnimation {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.1); }
    }

    /* Fancy Typing cursor */
    .typed-cursor {
        opacity: 1;
        animation: blink 0.7s infinite;
    }
    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

    /* Mobile adjustments */
    @media (max-width: 500px) {
        h1 { font-size: 2.5rem; }
        .affirmation-text { font-size: 1.1rem; }
        .container { padding: 30px 20px; }
    }
</style>
</head>
<body>

<!-- This holds the falling hearts/confetti -->
<div id="confetti-container"></div>

<div class="container">
    <div class="top-sparkle sparkle">✨</div>
    
    <h1>Happy Mother's Day!</h1>
    <div class="first-mothers-day">Neha</div>
    
    <p class="subtitle">Tap the button below for a sweet reminder of how much Ezan and I love you.</p>

    <div class="affirmation-display">
        <!-- New advanced: Text types out dynamically -->
        <div class="affirmation-text" id="text">Tap the button! <span class="sparkle">💖</span></div>
    </div>

    <!-- Fancy button with shine effect on hover -->
    <button onclick="newAffirmation()" id="loveButton">Click for some love ✨</button>

    <div class="bottom-decor">
        🍼 &nbsp; 🧸 &nbsp; 🌷
    </div>
</div>

<script>
    // Keeping your personalized mix of affirmations exactly as they were
    const affirmations = [
        "Every time Ezan looks up at you, I can see how completely safe and loved he feels.",
        "Meri jaan, you are the heart of our family. Ezan and I are so lucky to have you.",
        "You deserve all the sleep in the world, plus an endless supply of Thai Food!",
        "Seeing the way you nurture Ezan during these precious early months makes me so incredibly proud.",
        "I promise to always keep the Domino's pan pizza coming, especially on the days you need a break the most.",
        "Thank you for being such an amazing partner and the most wonderful mother.",
        "Even when we're exhausted and just trying to figure out this parenting thing, there's no one else I'd rather be doing it with.",
        "Ezan has only been with us for a little while, but you've already given him a lifetime of love.",
        "Thanks for tracking everthing from his sleep to his poops, and for being the most attentive and loving mom.",
        "I know these early days are tough, but you're doing an incredible job. Ezan and I are so grateful for you every single day.",
    ];

    let lastIndex = -1;
    let isTyping = false; // Prevent overlapping clicks

    function newAffirmation() {
        if (isTyping) return; // Wait until current text finishes

        const textElement = document.getElementById('text');
        
        // Find new index
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * affirmations.length);
        } while (randomIndex === lastIndex && affirmations.length > 1);
        lastIndex = randomIndex;
        const fullText = affirmations[randomIndex];

        // Advanced: Trigger heart confetti celebration!
        celebrate();
        
        // Fancy: Typewriter effect
        typeWriter(textElement, fullText);
    }

    // Advanced typing effect function
    function typeWriter(element, text) {
        isTyping = true;
        element.innerHTML = ""; // Clear existing text
        
        // Change button text temporarily
        document.getElementById('loveButton').innerText = "Sending love... 💖";
        
        let i = 0;
        const speed = 40; // Speed of typing in ms

        function type() {
            if (i < text.length) {
                element.innerHTML += text.charAt(i);
                i++;
                setTimeout(type, speed);
            } else {
                // Once typing finishes
                isTyping = false;
                // Fancy: Add a subtle heart at the end of every message
                element.innerHTML += " ❤️";
                document.getElementById('loveButton').innerText = "Tap for more love! ✨";
            }
        }
        type();
    }

    // Advanced: Pure JS heart confetti effect
    function celebrate() {
        const container = document.getElementById('confetti-container');
        
        // Colors for cute confetti
        const colors = ['#FFC0CB', '#FFB6C1', '#D87093', '#FFF']; 

        for (let i = 0; i < 30; i++) {
            const heart = document.createElement('div');
            
            // Random choice between a circle particle and a heart emoji for "cute"
            if (Math.random() > 0.5) {
                 heart.innerHTML = '❤️';
            } else {
                 heart.innerHTML = '✨';
            }
           
            heart.style.position = 'absolute';
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            
            // Random start position (scattered around the container)
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-5vh';
            
            // Random fall animation
            heart.style.transition = `transform ${Math.random() * 2 + 2}s linear, opacity ${Math.random() * 2 + 2}s linear`;
            
            container.appendChild(heart);
            
            // Trigger animation after append
            requestAnimationFrame(() => {
                const fallDuration = Math.random() * 2000 + 1500;
                
                heart.style.transform = `translateY(${window.innerHeight + 100}px) rotate(${Math.random() * 360}deg)`;
                heart.style.opacity = '0';
                
                // Remove heart from DOM after it falls
                setTimeout(() => {
                    heart.remove();
                }, fallDuration + 1000);
            });
        }
    }
</script>

</body>
</html>
